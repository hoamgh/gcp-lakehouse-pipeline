version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: fact_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

  - name: fact_order_items
    columns:
      - name: order_item_sk
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

  - name: fact_shipments
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id

  - name: dim_date
    description: "Date dimension. Range is derived dynamically from the earliest order date to 5 years from today."
    columns:
      - name: date_id
        description: "Surrogate key in YYYYMMDD integer format."
        tests:
          - unique
          - not_null
      - name: full_date
        description: "The calendar date."
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: month_number
        tests:
          - not_null
      - name: day_of_month
        tests:
          - not_null
