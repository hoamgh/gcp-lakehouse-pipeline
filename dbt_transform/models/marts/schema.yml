version: 2

models:
  - name: dim_customers
    description: "SCD Type 2 customer dimension. The first real version resolves an inferred member without changing its SK."
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_products
    description: "SCD Type 1 product dimension; latest attributes overwrite prior values."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_sellers
    description: "SCD Type 1 seller dimension; latest attributes overwrite prior values."
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_id
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]

  - name: fact_orders
    description: "Transaction fact at one row per order; customer SK identifies the SCD2 version valid at purchase time."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: customer_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
      - name: purchase_date_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

  - name: fact_order_items
    description: "Transaction fact at one row per order item."
    columns:
      - name: order_item_sk
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
              config:
                severity: warn
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
              config:
                severity: warn
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
              config:
                severity: warn

  - name: fact_payments
    description: "Transaction fact at one row per payment event."
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
              config:
                severity: warn

  - name: fact_reviews
    description: "Event fact at one row per customer review."
    columns:
      - name: review_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
              config:
                severity: warn

  - name: fact_shipments
    description: "Accumulating snapshot fact at one row per shipment."
    columns:
      - name: shipment_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
              config:
                severity: warn
