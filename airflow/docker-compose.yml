x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Default GCP project and json path inside container
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp-credentials.json
    PROJECT_ID: ${PROJECT_ID:?Set PROJECT_ID}
    REGION: ${REGION:-asia-southeast1}
    GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET}
    SERVICE_ACCOUNT_NAME: ${SERVICE_ACCOUNT_NAME:?Set SERVICE_ACCOUNT_NAME}
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: 'google-cloud-platform://?extra__google_cloud_platform__key_path=%2Fopt%2Fairflow%2Fgcp-credentials.json&extra__google_cloud_platform__project=${PROJECT_ID}'
    RECON_COUNT_WARN_PCT: ${RECON_COUNT_WARN_PCT:-0.01}
    RECON_COUNT_FAIL_PCT: ${RECON_COUNT_FAIL_PCT:-0.05}
    RECON_VALUE_WARN_PCT: ${RECON_VALUE_WARN_PCT:-0.001}
    RECON_VALUE_FAIL_PCT: ${RECON_VALUE_FAIL_PCT:-0.01}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # Mount the GCP credentials dynamically based on user setup
    - ../data_generator/${GCP_CREDENTIALS_FILE:?Set GCP_CREDENTIALS_FILE}:/opt/airflow/gcp-credentials.json:ro
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    command: >-
      bash -c "airflow db migrate &&
      (airflow users create
      --username $${AIRFLOW_ADMIN_USERNAME}
      --password $${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin --lastname User --role Admin
      --email admin@example.com || airflow users list)"
    environment:
      <<: *airflow-common-env
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  data-generator:
    build:
      context: ../data_generator
      dockerfile: Dockerfile
    # Map .env variables to the container
    env_file:
      - ../.env
    volumes:
      # Map the credentials file dynamically
    - ../data_generator/${GCP_CREDENTIALS_FILE:?Set GCP_CREDENTIALS_FILE}:/app/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
